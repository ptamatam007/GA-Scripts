name: Sequential jobs Demo

on: workflow_dispatch

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Build Step
              run: echo "Building application"

    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: test step
              run: echo "tuuning test"

    deploy:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Deploy Step
              run: echo "Deploying application"