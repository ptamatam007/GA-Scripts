name: Jobs execting by order using need option

on: workflow_dispatch

jobs:
    job1:
        runs-on: ubuntu-latest
        steps:
            - name: Job1 Step
              run: echo "This job1"
    job2:
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: Job2 Step
              run: echo "This is job2 "
    job3:
        runs-on: ubuntu-latest
        needs: job2
        steps:
            - name: Job3 step
              run: echo "This is job3 waiting to run after job2"
    job4:
        runs-on: ubuntu-latest
        needs: job3
        steps:
            - name: Job4 step
              run: echo "This is job4 wating to run after job3" 